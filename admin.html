<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Panel - ১০ নং সাতবাড়ীয়া কাঁচাবাজার</title>

<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:'Hind Siliguri',sans-serif;
    background:#f1f5f9;
    color:#1e293b;
}

.hidden{
    display:none!important;
}

/* ================= LOGIN ================= */

#loginPage{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    background:linear-gradient(135deg,#166534,#22c55e);
}

.login-box{
    width:100%;
    max-width:420px;
    background:white;
    padding:35px 25px;
    border-radius:20px;
    box-shadow:0 15px 40px rgba(0,0,0,.20);
}

.login-logo{
    text-align:center;
    margin-bottom:25px;
}

.login-logo .icon{
    width:70px;
    height:70px;
    margin:auto;
    border-radius:50%;
    background:#dcfce7;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:35px;
}

.login-logo h1{
    margin-top:12px;
    color:#166534;
    font-size:25px;
}

.login-logo p{
    color:#64748b;
    font-size:14px;
}

.form-group{
    margin-bottom:17px;
}

.form-group label{
    display:block;
    margin-bottom:7px;
    font-weight:600;
}

.form-group input,
.form-group select,
.form-group textarea{
    width:100%;
    padding:12px 13px;
    border:1px solid #cbd5e1;
    border-radius:10px;
    outline:none;
    font-family:inherit;
    font-size:15px;
    background:#fff;
}

.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus{
    border-color:#16a34a;
    box-shadow:0 0 0 3px rgba(22,163,74,.1);
}

.login-btn{
    width:100%;
    border:0;
    background:#16a34a;
    color:white;
    padding:13px;
    border-radius:10px;
    font-family:inherit;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
}

.login-btn:hover{
    background:#15803d;
}

.login-btn:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.error-box{
    background:#fee2e2;
    color:#b91c1c;
    border:1px solid #fecaca;
    padding:11px;
    border-radius:9px;
    margin-bottom:15px;
    font-size:14px;
    line-height:1.5;
}

/* ================= ADMIN ================= */

#adminPage{
    min-height:100vh;
}

.topbar{
    background:#166534;
    color:white;
    height:65px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 22px;
    position:sticky;
    top:0;
    z-index:100;
}

.topbar-title{
    font-size:21px;
    font-weight:700;
}

.topbar-right{
    display:flex;
    align-items:center;
    gap:12px;
}

.admin-email{
    font-size:13px;
    opacity:.9;
}

.logout-btn{
    border:0;
    background:#dc2626;
    color:white;
    padding:8px 13px;
    border-radius:8px;
    font-family:inherit;
    cursor:pointer;
}

.container{
    max-width:1250px;
    margin:auto;
    padding:22px;
}

/* ================= STATS ================= */

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
    margin-bottom:22px;
}

.stat-card{
    background:white;
    padding:20px;
    border-radius:14px;
    box-shadow:0 2px 8px rgba(0,0,0,.06);
}

.stat-card .label{
    color:#64748b;
    font-size:14px;
}

.stat-card .value{
    margin-top:5px;
    font-size:27px;
    font-weight:700;
    color:#166534;
}

/* ================= TABS ================= */

.tabs{
    display:flex;
    gap:8px;
    background:white;
    padding:8px;
    border-radius:12px;
    margin-bottom:18px;
    overflow-x:auto;
}

.tab-btn{
    border:0;
    background:transparent;
    padding:10px 18px;
    border-radius:8px;
    font-family:inherit;
    font-size:15px;
    cursor:pointer;
    white-space:nowrap;
}

.tab-btn.active{
    background:#16a34a;
    color:white;
}

/* ================= CONTENT ================= */

.panel{
    background:white;
    border-radius:14px;
    padding:20px;
    box-shadow:0 2px 8px rgba(0,0,0,.06);
}

.panel-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    margin-bottom:18px;
    flex-wrap:wrap;
}

.panel-title{
    font-size:21px;
    font-weight:700;
}

.primary-btn{
    background:#16a34a;
    color:white;
    border:0;
    padding:10px 15px;
    border-radius:9px;
    font-family:inherit;
    cursor:pointer;
    font-weight:600;
}

.primary-btn:hover{
    background:#15803d;
}

/* ================= TABLE ================= */

.table-wrap{
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:750px;
}

th,
td{
    padding:12px 10px;
    border-bottom:1px solid #e2e8f0;
    text-align:left;
    font-size:14px;
}

th{
    background:#f8fafc;
    color:#475569;
}

.product-img{
    width:55px;
    height:55px;
    object-fit:cover;
    border-radius:8px;
    background:#e2e8f0;
}

.action-btn{
    border:0;
    padding:6px 10px;
    border-radius:7px;
    font-family:inherit;
    cursor:pointer;
    margin-right:4px;
}

.edit-btn{
    background:#dbeafe;
    color:#1d4ed8;
}

.delete-btn{
    background:#fee2e2;
    color:#dc
