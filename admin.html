<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Panel - ১০ নং সাতবাড়ীয়া কাঁচাবাজার</title>

<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:'Hind Siliguri',sans-serif;
    background:#f1f5f9;
    color:#1e293b;
}

button,
input,
select,
textarea{
    font-family:inherit;
}

.hidden{
    display:none!important;
}

/* ================= LOGIN ================= */

#loginPage{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:linear-gradient(135deg,#166534,#22c55e);
}

.login-box{
    width:100%;
    max-width:420px;
    background:#fff;
    padding:35px 25px;
    border-radius:20px;
    box-shadow:0 15px 40px rgba(0,0,0,.22);
}

.login-logo{
    text-align:center;
    margin-bottom:25px;
}

.login-icon{
    width:72px;
    height:72px;
    margin:auto;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#dcfce7;
    font-size:36px;
}

.login-logo h1{
    margin-top:12px;
    color:#166534;
    font-size:25px;
}

.login-logo p{
    color:#64748b;
    font-size:14px;
}

.form-group{
    margin-bottom:16px;
}

.form-group label{
    display:block;
    margin-bottom:7px;
    font-weight:600;
}

.form-group input,
.form-group select,
.form-group textarea{
    width:100%;
    padding:12px 13px;
    border:1px solid #cbd5e1;
    border-radius:10px;
    outline:none;
    background:#fff;
    color:#1e293b;
    font-size:15px;
}

.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus{
    border-color:#16a34a;
    box-shadow:0 0 0 3px rgba(22,163,74,.10);
}

.login-btn{
    width:100%;
    border:0;
    background:#16a34a;
    color:#fff;
    padding:13px;
    border-radius:10px;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
}

.login-btn:hover{
    background:#15803d;
}

.login-btn:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.error-box{
    background:#fee2e2;
    color:#b91c1c;
    border:1px solid #fecaca;
    padding:11px;
    border-radius:9px;
    margin-bottom:15px;
    font-size:14px;
    line-height:1.5;
}

/* ================= ADMIN ================= */

#adminPage{
    min-height:100vh;
}

.topbar{
    background:#166534;
    color:#fff;
    min-height:65px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
    padding:10px 22px;
    position:sticky;
    top:0;
    z-index:100;
}

.topbar-title{
    font-size:21px;
    font-weight:700;
}

.topbar-right{
    display:flex;
    align-items:center;
    gap:10px;
}

.admin-email{
    font-size:13px;
    opacity:.9;
}

.logout-btn{
    border:0;
    background:#dc2626;
    color:#fff;
    padding:8px 13px;
    border-radius:8px;
    cursor:pointer;
}

.container{
    max-width:1400px;
    margin:auto;
    padding:20px;
}

/* ================= STATS ================= */

.stats{
    display:grid;
    grid-template-columns:repeat(6,1fr);
    gap:12px;
    margin-bottom:18px;
}

.stat-card{
    background:#fff;
    padding:17px;
    border-radius:13px;
    box-shadow:0 2px 8px rgba(0,0,0,.06);
    border-left:4px solid #16a34a;
}

.stat-label{
    color:#64748b;
    font-size:13px;
}

.stat-value{
    margin-top:4px;
    font-size:25px;
    font-weight:700;
    color:#166534;
}

/* ================= TABS ================= */

.tabs{
    display:flex;
    gap:7px;
    background:#fff;
    padding:7px;
    border-radius:12px;
    margin-bottom:16px;
    overflow-x:auto;
}

.tab-btn{
    border:0;
    background:transparent;
    color:#334155;
    padding:10px 18px;
    border-radius:8px;
    font-size:15px;
    cursor:pointer;
    white-space:nowrap;
}

.tab-btn.active{
    background:#16a34a;
    color:#fff;
}

/* ================= PANEL ================= */

.panel{
    background:#fff;
    border-radius:14px;
    padding:18px;
    box-shadow:0 2px 8px rgba(0,0,0,.06);
    margin-bottom:18px;
}

.panel-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:17px;
}

.panel-title{
    font-size:21px;
    font-weight:700;
}

.primary-btn{
    border:0;
    background:#16a34a;
    color:#fff;
    padding:10px 15px;
    border-radius:9px;
    cursor:pointer;
    font-weight:600;
}

.primary-btn:hover{
    background:#15803d;
}

.secondary-btn{
    border:0;
    background:#e2e8f0;
    color:#334155;
    padding:10px 15px;
    border-radius:9px;
    cursor:pointer;
    font-weight:600;
}

/* ================= TOOLBAR ================= */

.toolbar{
    display:grid;
    grid-template-columns:2fr 1fr 1fr 1fr auto;
    gap:8px;
    margin-bottom:14px;
}

.toolbar input,
.toolbar select{
    width:100%;
    padding:10px 11px;
    border:1px solid #cbd5e1;
    border-radius:8px;
    outline:none;
    background:#fff;
}

.toolbar input:focus,
.toolbar select:focus{
    border-color:#16a34a;
}

/* ================= TABLE ================= */

.table-wrap{
    overflow-x:auto;
}

table{
    width:100%;
    min-width:1050px;
    border-collapse:collapse;
}

th,
td{
    padding:10px 9px;
    border-bottom:1px solid #e2e8f0;
    text-align:left;
    font-size:13px;
    vertical-align:middle;
}

th{
    background:#166534;
    color:#fff;
    font-weight:600;
    white-space:nowrap;
}

tr:hover td{
    background:#f8fafc;
}

.status-select{
    padding:6px 8px;
    border:1px solid #cbd5e1;
    border-radius:7px;
    background:#fff;
    min-width:125px;
}

.action-btn{
    border:0;
    padding:6px 9px;
    border-radius:7px;
    cursor:pointer;
    font-size:13px;
    margin:2px;
}

.save-btn{
    background:#dcfce7;
    color:#166534;
}

.delete-btn{
    background:#fee2e2;
    color:#dc2626;
}

/* ================= MOBILE ORDER CARDS ================= */

.mobile-orders{
    display:none;
}

.order-card{
    background:#fff;
    border:1px solid #e2e8f0;
    border-radius:12px;
    padding:13px;
    margin-bottom:10px;
}

.order-row{
    display:flex;
    justify-content:space-between;
    gap:10px;
    padding:6px 0;
    border-bottom:1px solid #eef2f7;
}

.order-row:last-child{
    border-bottom:0;
}

.order-label{
    color:#64748b;
}

.order-value{
    text-align:right;
    font-weight:600;
    max-width:65%;
    word-break:break-word;
}

.mobile-status{
    width:100%;
    margin-top:9px;
    padding:9px;
    border:1px solid #cbd5e1;
    border-radius:8px;
}

.mobile-save{
    width:100%;
    margin-top:7px;
}

/* ================= PRODUCT TABLE ================= */

.product-img{
    width:52px;
    height:52px;
    object-fit:cover;
    border-radius:8px;
    background:#e2e8f0;
}

.no-image{
    width:52px;
    height:52px;
    border-radius:8px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#f1f5f9;
    color:#94a3b8;
}

/* ================= MODAL ================= */

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.55);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:18px;
    z-index:300;
}

.modal-box{
    width:100%;
    max-width:550px;
    max-height:90vh;
    overflow-y:auto;
    background:#fff;
    border-radius:15px;
    padding:20px;
}

.modal-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    margin-bottom:18px;
}

.close-btn{
    width:35px;
    height:35px;
    border:0;
    border-radius:50%;
    background:#f1f5f9;
    cursor:pointer;
    font-size:20px;
}

.modal-actions{
    display:flex;
    justify-content:flex-end;
    gap:9px;
    margin-top:18px;
}

/* ================= NOTIFICATION ================= */

#notificationArea{
    position:fixed;
    right:15px;
    top:80px;
    z-index:500;
}

.notice{
    width:min(340px,calc(100vw - 30px));
    background:#fff;
    border-left:5px solid #16a34a;
    box-shadow:0 10px 30px rgba(0,0,0,.18);
    border-radius:10px;
    padding:13px;
    margin-bottom:9px;
}

.notice-title{
    font-weight:700;
    color:#166534;
}

.notice-text{
    color:#475569;
    font-size:14px;
    margin-top:3px;
}

/* ================= EMPTY ================= */

.empty{
    text-align:center;
    color:#64748b;
    padding:35px 10px;
}

/* ================= RESPONSIVE ================= */

@media(max-width:1100px){
    .stats{
        grid-template-columns:repeat(3,1fr);
    }
    .toolbar{
        grid-template-columns:2fr 1fr 1fr;
    }
}

@media(max-width:800px){
    .stats{
        grid-template-columns:repeat(2,1fr);
    }
    .topbar{
        padding:11px 14px;
        flex-wrap:wrap;
    }
    .topbar-title{
        font-size:18px;
    }
    .admin-email{
        display:none;
    }
    .container{
        padding:13px;
    }
    .panel{
        padding:14px;
    }
    .table-wrap{
        display:none;
    }
    .mobile-orders{
        display:block;
    }
    .toolbar{
        grid-template-columns:1fr 1fr;
    }
}

@media(max-width:500px){
    .stats{
        grid-template-columns:1fr 1fr;
        gap:8px;
    }
    .stat-card{
        padding:13px;
    }
    .stat-value{
        font-size:21px;
    }
    .toolbar{
        grid-template-columns:1fr;
    }
    .login-box{
        padding:28px 20px;
    }
    .topbar-right{
        width:100%;
        justify-content:flex-end;
    }
    .modal{
        padding:10px;
    }
}
</style>
</head>

<body>

<!-- ================= NOTIFICATION ================= -->

<div id="notificationArea"></div>


<!-- ================= LOGIN ================= -->

<div id="loginPage">

    <div class="login-box">

        <div class="login-logo">
            <div class="login-icon">🥬</div>
            <h1>১০ নং সাতবাড়ীয়া</h1>
            <p>কাঁচাবাজার Admin Panel</p>
        </div>

        <div id="loginError" class="error-box hidden"></div>

        <form id="loginForm">

            <div class="form-group">
                <label>Admin Email</label>
                <input
                    type="email"
                    id="loginEmail"
                    placeholder="admin@gmail.com"
                    autocomplete="username"
                    required
                >
            </div>

            <div class="form-group">
                <label>পাসওয়ার্ড</label>
                <input
                    type="password"
                    id="loginPassword"
                    placeholder="পাসওয়ার্ড দিন"
                    autocomplete="current-password"
                    required
                >
            </div>

            <button
                type="submit"
                id="loginBtn"
                class="login-btn">
                লগইন করুন
            </button>

        </form>

    </div>

</div>


<!-- ================= ADMIN ================= -->

<div id="adminPage" class="hidden">

    <div class="topbar">

        <div class="topbar-title">
            🥬 ১০ নং সাতবাড়ীয়া কাঁচাবাজার
        </div>

        <div class="topbar-right">

            <span id="adminEmail" class="admin-email"></span>

            <button
                id="logoutBtn"
                class="logout-btn">
                Logout
            </button>

        </div>

    </div>


    <div class="container">

        <!-- ================= STATS ================= -->

        <div class="stats">

            <div class="stat-card">
                <div class="stat-label">মোট পণ্য</div>
                <div class="stat-value" id="totalProducts">0</div>
            </div>

            <div class="stat-card">
                <div class="stat-label">মোট অর্ডার</div>
                <div class="stat-value" id="totalOrders">0</div>
            </div>

            <div class="stat-card">
                <div class="stat-label">Pending</div>
                <div class="stat-value" id="pendingOrders">0</div>
            </div>

            <div class="stat-card">
                <div class="stat-label">Processing</div>
                <div class="stat-value" id="processingOrders">0</div>
            </div>

            <div class="stat-card">
                <div class="stat-label">Completed</div>
                <div class="stat-value" id="completedOrders">0</div>
            </div>

            <div class="stat-card">
                <div class="stat-label">আজকের বিক্রি</div>
                <div class="stat-value" id="todaySales">৳0</div>
            </div>

        </div>


        <!-- ================= TABS ================= -->

        <div class="tabs">

            <button
                class="tab-btn active"
                data-tab="orders">
                🛒 অর্ডার
            </button>

            <button
                class="tab-btn"
                data-tab="products">
                🥬 পণ্য
            </button>

            <button
                class="tab-btn"
                data-tab="settings">
                ⚙️ সেটিংস
            </button>

        </div>


        <!-- ================= ORDERS ================= -->

        <section
            id="ordersTab"
            class="panel tab-content">

            <div class="panel-header">

                <div class="panel-title">
                    অর্ডার তালিকা
                </div>

                <button
                    id="refreshOrdersBtn"
                    class="primary-btn">
                    🔄 Refresh
                </button>

            </div>


            <div class="toolbar">

                <input
                    id="orderSearch"
                    type="search"
                    placeholder="🔎 Order ID / নাম / ফোন / ঠিকানা">

                <select id="statusFilter">

                    <option value="">সব Status</option>
                    <option value="Pending">Pending</option>
                    <option value="Confirmed">Confirmed</option>
                    <option value="Processing">Processing</option>
                    <option value="Delivered">Delivered</option>
                    <option value="Completed">Completed</option>
                    <option value="Cancelled">Cancelled</option>

                </select>

                <select id="dateFilter">

                    <option value="">সব তারিখ</option>
                    <option value="today">আজ</option>
                    <option value="yesterday">গতকাল</option>
                    <option value="7days">শেষ ৭ দিন</option>
                    <option value="30days">শেষ ৩০ দিন</option>

                </select>

                <select id="sortFilter">

                    <option value="newest">নতুন আগে</option>
                    <option value="oldest">পুরোনো আগে</option>
                    <option value="high">বেশি দাম আগে</option>
                    <option value="low">কম দাম আগে</option>

                </select>

                <button
                    id="exportBtn"
                    class="primary-btn">
                    📥 CSV
                </button>

            </div>


            <!-- DESKTOP -->

            <div class="table-wrap">

                <table>

                    <thead>

                        <tr>
                            <th>Order</th>
                            <th>Customer</th>
                            <th>Phone</th>
                            <th>Address</th>
                            <th>Total</th>
                            <th>Date</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>

                    </thead>

                    <tbody id="ordersTable"></tbody>

                </table>

            </div>


            <!-- MOBILE -->

            <div
                id="mobileOrders"
                class="mobile-orders">
            </div>

        </section>


        <!-- ================= PRODUCTS ================= -->

        <section
            id="productsTab"
            class="panel tab-content hidden">

            <div class="panel-header">

                <div class="panel-title">
                    🥬 পণ্য তালিকা
                </div>

                <button
                    id="addProductBtn"
                    class="primary-btn">
                    + নতুন পণ্য
                </button>

            </div>


            <div class="table-wrap">

                <table>

                    <thead>

                        <tr>
                            <th>ছবি</th>
                            <th>নাম</th>
                            <th>ক্যাটাগরি</th>
                            <th>দাম</th>
                            <th>ইউনিট</th>
                            <th>অ্যাকশন</th>
                        </tr>

                    </thead>

                    <tbody id="productsTable"></tbody>

                </table>

            </div>

        </section>


        <!-- ================= SETTINGS ================= -->

        <section
            id="settingsTab"
            class="panel tab-content hidden">

            <div class="panel-header">

                <div class="panel-title">
                    ⚙️ ওয়েবসাইট সেটিংস
                </div>

            </div>


            <div class="form-group">

                <label>দোকানের নাম</label>

                <input
                    type="text"
                    id="shopName"
                    placeholder="১০ নং সাতবাড়ীয়া কাঁচাবাজার">

            </div>


            <div class="form-group">

                <label>ডেলিভারি চার্জ</label>

                <input
                    type="number"
                    id="deliveryCharge"
                    min="0"
                    placeholder="0">

            </div>


            <div class="form-group">

                <label>যোগাযোগ নম্বর</label>

                <input
                    type="text"
                    id="contactNumber"
                    placeholder="01XXXXXXXXX">

            </div>


            <div class="form-group">

                <label>WhatsApp নম্বর</label>

                <input
                    type="text"
                    id="whatsappNumber"
                    placeholder="8801XXXXXXXXX">

            </div>


            <div class="form-group">

                <label>Facebook Page URL</label>

                <input
                    type="url"
                    id="facebookUrl"
                    placeholder="https://facebook.com/...">

            </div>


            <button
                id="saveSettingsBtn"
                class="primary-btn">
                💾 সেটিংস সংরক্ষণ
            </button>

        </section>

    </div>

</div>


<!-- ================= PRODUCT MODAL ================= -->

<div
    id="productModal"
    class="modal hidden">

    <div class="modal-box">

        <div class="modal-header">

            <h2 id="productModalTitle">
                নতুন পণ্য
            </h2>

            <button
                id="closeProductModal"
                class="close-btn">
                ×
            </button>

        </div>


        <input
            type="hidden"
            id="productId">


        <div class="form-group">

            <label>পণ্যের নাম</label>

            <input
                type="text"
                id="productName"
                placeholder="যেমন: আলু">

        </div>


        <div class="form-group">

            <label>ক্যাটাগরি</label>

            <select id="productCategory">

                <option value="সবজি">সবজি</option>
                <option value="ফল">ফল</option>
                <option value="মাছ">মাছ</option>
                <option value="মাংস">মাংস</option>
                <option value="মসলা">মসলা</option>
                <option value="অন্যান্য">অন্যান্য</option>

            </select>

        </div>


        <div class="form-group">

            <label>দাম</label>

            <input
                type="number"
                id="productPrice"
                min="0"
                placeholder="দাম">

        </div>


        <div class="form-group">

            <label>ইউনিট</label>

            <input
                type="text"
                id="productUnit"
                placeholder="কেজি / পিস / লিটার">

        </div>


        <div class="form-group">

            <label>ছবির URL</label>

            <input
                type="url"
                id="productImage"
                placeholder="https://...">

        </div>


        <div class="modal-actions">

            <button
                id="cancelProductBtn"
                class="secondary-btn">
                বাতিল
            </button>

            <button
                id="saveProductBtn"
                class="primary-btn">
                💾 সংরক্ষণ
            </button>

        </div>

    </div>

</div>


<script>

/* =====================================================
   FIREBASE CONFIG (সঠিক কনফিগারেশন বসানো হয়েছে)
===================================================== */

const firebaseConfig = {
    apiKey: "AIzaSyDGZjvvz_mbiVPgKtUAdMwN...", // আপনার সঠিক API Key এখানে থাকবে

function $(id){

function escapeHtml(value){
    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}

function normalizeStatus(status){
    const s = String(status || "Pending").trim().toLowerCase();
    if(s.includes("pending")) return "Pending";
    if(s.includes("confirmed")) return "Confirmed";
    if(s.includes("processing")) return "Processing";
    if(s.includes("delivered")) return "Delivered";
    if(s.includes("completed")) return "Completed";
    if(s.includes("cancelled") || s.includes("canceled")) return "Cancelled";
    return "Pending";
}

function getOrderDate(order){
    if(order && order.createdAt){
        const d = new Date(Number(order.createdAt));
        if(!isNaN(d.getTime())) return d;
    }
    if(order && order.date){
        const d = new Date(order.date);
        if(!isNaN(d.getTime())) return d;
    }
    return null;
}

function formatDate(order){
    const d = getOrderDate(order);
    if(!d) return "তারিখ নেই";
    return d.toLocaleString("bn-BD", {
        year:"numeric",
        month:"short",
        day:"numeric",
        hour:"numeric",
        minute:"2-digit"
    });
}

function sameDay(a,b){
    return a.getFullYear() === b.getFullYear()
        && a.getMonth() === b.getMonth()
        && a.getDate() === b.getDate();
}

function showNotice(title,text){
    const box = document.createElement("div");
    box.className = "notice";
    box.innerHTML = `
        <div class="notice-title">${escapeHtml(title)}</div>
        <div class="notice-text">${escapeHtml(text)}</div>
    `;
    $("notificationArea").appendChild(box);
    setTimeout(function(){ box.remove(); }, 5000);
}

function playNotificationSound(){
    try{
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if(!AudioContext) return;
        const ctx = new AudioContext();
        const oscillator = ctx.createOscillator();
        const gain = ctx.createGain();
        oscillator.type = "sine";
        oscillator.frequency.value = 880;
        gain.gain.setValueAtTime(0.0001, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.25, ctx.currentTime + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.35);
        oscillator.connect(gain);
        gain.connect(ctx.destination);
        oscillator.start();
        oscillator.stop(ctx.currentTime + 0.35);
    } catch(error){
        console.log("Notification sound unavailable", error);
    }
}

async function saveProduct(){

async function startOrders(){
    if(ordersListener){
        db.ref("orders").off("value", ordersListener);
    }
    knownOrderIds = new Set();
    initializedOrders = false;

    try{
        const initial = await db.ref("orders").once("value");
        const data = initial.val() || {};
        Object.keys(data).forEach(function(id){ knownOrderIds.add(id); });
        initializedOrders = true;
    } catch(error){
        console.error("Initial order load error:", error);
    }

    ordersListener = function(snapshot){
        ordersCache = snapshot.val() || {};
        renderOrders();
        updateDashboard();
    };

    db.ref("orders").on("value", ordersListener);
    db.ref("orders").on("child_added", handleNewOrder);
}

function handleNewOrder(snapshot){
    const id = snapshot.key;
    if(!initializedOrders){ knownOrderIds.add(id); return; }
    if(knownOrderIds.has(id)) return;

    knownOrderIds.add(id);
    const order = snapshot.val() || {};
    const name = order.name || order.customerName || "নতুন Customer";

    showNotice("🔔 নতুন অর্ডার এসেছে!", `${name} — অর্ডার #${id}`);
    playNotificationSound();
}


/* =====================================================
   DASHBOARD
===================================================== */

function updateDashboard(){
    const orders = Object.values(ordersCache);
    let pending = 0, processing = 0, completed = 0, todaySales = 0;
    const today = new Date();

    orders.forEach(function(order){
        const status = normalizeStatus(order.status);
        if(status === "Pending") pending++;
        if(status === "Processing") processing++;
        if(status === "Completed" || status === "Delivered") completed++;

        if(status === "Completed" || status === "Delivered"){
            const d = getOrderDate(order);
            if(d && sameDay(d,today)){
                todaySales += Number(order.total || order.grandTotal || 0);
            }
        }
    });

    $("totalOrders").textContent = orders.length;
    $("pendingOrders").textContent = pending;
    $("processingOrders").textContent = processing;
    $("completedOrders").textContent = completed;
    $("todaySales").textContent = "৳"+todaySales;
}


/* =====================================================
   FILTER ORDERS
===================================================== */

function getFilteredOrders(){
    const search = $("orderSearch").value.trim().toLowerCase();
    const status = $("statusFilter").value;
    const dateFilter = $("dateFilter").value;
    const sort = $("sortFilter").value;

    let entries = Object.entries(ordersCache);

    entries = entries.filter(function([id,order]){
        const text = [
            id, order.orderId, order.name, order.customerName,
            order.phone, order.customerPhone, order.address, order.total
        ].filter(Boolean).join(" ").toLowerCase();

        if(search && !text.includes(search)) return false;
        if(status && normalizeStatus(order.status) !== status) return false;

        const d = getOrderDate(order);
        if(dateFilter && !d) return false;

        if(dateFilter && d){
            const now = new Date();
            const start = new Date(now);
            start.setHours(0,0,0,0);

            if(dateFilter === "today" && !sameDay(d,now)) return false;
            if(dateFilter === "yesterday"){
                const y = new Date(start);
                y.setDate(y.getDate()-1);
                if(!sameDay(d,y)) return false;
            }
            if(dateFilter === "7days"){
                const x = new Date();
                x.setDate(x.getDate()-7);
                if(d < x) return false;
            }
            if(dateFilter === "30days"){
                const x = new Date();
                x.setDate(x.getDate()-30);
                if(d < x) return false;
            }
        }
        return true;
    });

    entries.sort(function(a,b){
        const oa = a[1], ob = b[1];
        if(sort === "high") return Number(ob.total || ob.grandTotal || 0) - Number(oa.total || oa.grandTotal || 0);
        if(sort === "low") return Number(oa.total || oa.grandTotal || 0) - Number(ob.total || ob.grandTotal || 0);

        const da = getOrderDate(oa)?.getTime() || 0;
        const dbb = getOrderDate(ob)?.getTime() || 0;

        if(sort === "oldest") return da - dbb;
        return dbb - da;
    });

    return entries;
}

            order.total || order.grandTotal || 0,
            formatDate(order),

        ]);

    const csv = rows.map(function(row){
        return row.map(function(value){
            return `"${String(value ?? "").replace(/"/g,'""')}"`;
        }).join(",");
    }).join("\n");

    const blob = new Blob(["\ufeff"+csv], { type: "text/csv;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "kachabazar-orders.csv";
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
});

async function loadSettings(){
    try{
        const snapshot = await db.ref("settings").once("value");
        const settings = snapshot.val() || {};

        $("shopName").value = settings.shopName || "১০ নং সাতবাড়ীয়া কাঁচাবাজার";
        $("deliveryCharge").value = settings.deliveryCharge ?? 0;
        $("contactNumber").value = settings.contactNumber || "";
        $("whatsappNumber").value = settings.whatsapp || settings.whatsappNumber || "";
        $("facebookUrl").value = settings.facebook || settings.facebookUrl || "";
    } catch(error){
        console.error("Settings load error:", error);
    }
}


/* =====================================================
   SAVE SETTINGS
===================================================== */

$("saveSettingsBtn").addEventListener("click", saveSettings);

async function saveSettings(){
    const settings = {
        shopName: $("shopName").value.trim(),
        deliveryCharge: Number($("deliveryCharge").value || 0),
        contactNumber: $("contactNumber").value.trim(),
        whatsapp: $("whatsappNumber").value.trim(),
        facebook: $("facebookUrl").value.trim(),
        updatedAt: Date.now()
    };

    try{
        await db.ref("settings").set(settings);
        showNotice("সেটিংস সংরক্ষিত", "ওয়েবসাইট সেটিংস সফলভাবে আপডেট হয়েছে।");
    } catch(error){
        console.error(error);
        alert("সেটিংস সংরক্ষণ করা যায়নি:\n"+error.message);
    }
}


/* =====================================================
   MODAL OUTSIDE CLICK
===================================================== */

$("productModal").addEventListener("click", function(e){
    if(e.target === $("productModal")){
        closeProductModal();
    }
});


/* =====================================================
   ESC KEY
===================================================== */

document.addEventListener("keydown", function(e){
    if(e.key === "Escape" && !$("productModal").classList.contains("hidden")){
        closeProductModal();
    }
});

</script>
