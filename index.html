<!DOCTYPE html>
<html lang="bn">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>১০ নং সাতবাড়ীয়া কাঁচাবাজার</title>

    <!-- CSS -->
    <link rel="stylesheet"
          href="style.css">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap"
          rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

</head>


<body>


<!-- =====================================================
     HEADER
===================================================== -->

<header class="header">

    <div class="container header-inner">

        <a href="#"
           class="logo">

            <i class="fa-solid fa-basket-shopping"></i>

            <span id="shopName">
                ১০ নং সাতবাড়ীয়া কাঁচাবাজার
            </span>

        </a>


        <div class="header-actions">

            <button
                type="button"
                class="cart-button"
                onclick="openCart()">

                <i class="fa-solid fa-cart-shopping"></i>

                <span>কার্ট</span>

                <b id="cartCount">0</b>

            </button>

        </div>

    </div>

</header>



<!-- =====================================================
     HERO
===================================================== -->

<section class="hero">

    <div class="container hero-content">

        <div class="hero-text">

            <h1 id="heroTitle">

                তাজা কাঁচামাল ও তরিতরকারি
                এখন আপনার ঘরে

            </h1>


            <p id="shopDescription">

                ১০ নং সাতবাড়ীয়া ইউনিয়নের ভিতরে সহজ হোম ডেলিভারি।

            </p>


            <a href="#products"
               class="hero-button">

                <i class="fa-solid fa-cart-shopping"></i>

                এখনই বাজার করুন

            </a>

        </div>

    </div>

</section>



<!-- =====================================================
     SHOP INFO
===================================================== -->

<section class="shop-info">

    <div class="container info-grid">


        <div class="info-card">

            <i class="fa-solid fa-truck"></i>

            <div>

                <strong>
                    হোম ডেলিভারি
                </strong>

                <p id="deliveryInfo">
                    ইউনিয়নের ভিতরে
                </p>

            </div>

        </div>



        <div class="info-card">

            <i class="fa-solid fa-money-bill-wave"></i>

            <div>

                <strong>
                    পেমেন্ট
                </strong>

                <p id="paymentInfo">
                    Cash on Delivery
                </p>

            </div>

        </div>



        <div class="info-card">

            <i class="fa-solid fa-phone"></i>

            <div>

                <strong>
                    যোগাযোগ
                </strong>

                <p id="phoneDisplay">
                    লোড হচ্ছে...
                </p>

            </div>

        </div>


    </div>

</section>



<!-- =====================================================
     SEARCH
===================================================== -->

<section class="search-section">

    <div class="container">

        <div class="search-box">
